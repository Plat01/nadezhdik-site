# /etc/nginx/sites-available/nadezhdik.conf — см. docs/deploy.md
# HTTPS-блок добавит certbot (certbot --nginx -d nadezhdik.ru -d www.nadezhdik.ru).

server {
    listen 80;
    listen [::]:80;
    server_name www.nadezhdik.ru;
    return 301 https://nadezhdik.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nadezhdik.ru;

    root /var/www/nadezhdik/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
    gzip_min_length 1024;

    # Старый адрес главной из Tilda
    location = /2 { return 301 /; }
    location = /2/ { return 301 /; }

    # Статика с неизменяемыми именами (ассеты Tilda, шрифты, хэшированные файлы Astro) — долгий кэш
    location ~ ^/(tilda|fonts|_astro)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /brand/ { expires 7d; try_files $uri =404; }

    # Приём заявок → server/lead-handler.mjs (systemd: nadezhdik-leads)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32k;
    }

    location / {
        # /english → /english/ (каталоги с index.html), затем 404
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
